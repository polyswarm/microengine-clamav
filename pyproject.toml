[tool.pdm]
package-dir = "src/"

[project]
name = "microengineclamav"
version = "0.4.0"
description = "Clamav Engine"
readme = "README.md"
authors = [
    {name = "PolySwarm Developers", email = "info@polyswarm.io"},
]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.10,<4"
dependencies = [
    "Flask",
    "celery",
    "clamd",
    "microengine-utils",
    "polyswarm-artifact",
    "python-json-logger",
    "requests",
]
license = "MIT"

[project.urls]
Homepage = "https://github.com/polyswarm/microengine-clamav"

[project.optional-dependencies]
tests = [
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "requests-mock",
]
